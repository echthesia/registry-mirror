name: mirror

# Copy each digest-pinned upstream image to ghcr.io/echthesia/<name>:<tag>.
# Copies BY DIGEST (not by tag) so what we publish is exactly what was reviewed
# and soaked — no TOCTOU where upstream :tag moves between merge and copy.
#
# Triggers:
#  - workflow_run after `validate`: when a soaked Dependabot digest bump auto-
#    merges, the merge push to main is made with GITHUB_TOKEN, which — by GitHub's
#    anti-recursion rule — does NOT fire the `push` trigger below (this silently
#    left GHCR stale once already). `validate` is the required check that gates
#    auto-merge, so chaining off its completion is our reliable post-merge signal.
#    Bonus: a workflow_run run gets a normal token with packages:write, unlike a
#    Dependabot-triggered run (which would be read-only). We check out main, so we
#    only ever publish merged state; runner-provisioning latency covers the brief
#    window between validate passing and the merge commit landing.
#  - push to main touching Dockerfile: covers human (non-token) commits.
#  - workflow_dispatch: manual / catch-up.

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    # On workflow_run, only proceed for a successful validate on a dependabot/*
    # branch. Those are the only PRs that auto-merge under GITHUB_TOKEN and so
    # need this chain; PAT-authored override PRs from scan.yml fire the `push`
    # trigger on their own. The branch test matters now that validate no longer
    # has a paths filter — without it, every passing PR check would kick off a
    # (harmless but pointless) full mirror+sign pass over main.
    # push/dispatch always run.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # always publish merged main state, never a PR head

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo

      # Pin the cosign BINARY, not just the action. The action major was doing
      # this job by accident: @v3 defaults to cosign v2.6.1, @v4 defaults to
      # v3.0.6. cosign v3 stores signatures as OCI 1.1 referrer-attached
      # Sigstore bundles, and c/image — what podman uses to enforce policy.json
      # on noema — only looks for the legacy `sha256-<digest>.sig` tag. A
      # v3-signed image is green in CI, passes `cosign verify`, and is
      # unverifiable at pull time: noema fails closed with "A signature was
      # required, but no signature exists" and silently keeps the old container.
      # Not fixable by flag either — cosign v3.1 removed --new-bundle-format,
      # and c/image has no referrers support at all. Don't unpin without
      # re-testing a real policy-gated pull on noema.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.1

      - name: Log in to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | skopeo login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          # cosign reads ~/.docker/config.json, not skopeo's auth file
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | cosign login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      # After each copy, re-sign the (verbatim-preserved) digest with the shared
      # echthesia signing key: noema's policy.json (echthesia/infra) rejects
      # unsigned ghcr.io/echthesia/* pulls, so an unsigned mirror copy would
      # never deploy. The signature attests "this digest went through the
      # Dependabot cooldown + validate pipeline" — nothing about upstream.
      # verify-before-sign keeps re-runs (dispatch, catch-up) from stacking
      # duplicate signatures onto an already-signed digest.
      - name: Copy pinned digests to ghcr.io/echthesia and sign them
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"   # GHCR paths must be lowercase
          cosign public-key --key env://COSIGN_PRIVATE_KEY --outfile /tmp/cosign.pub
          grep '^FROM ' Dockerfile | while read -r _ ref _ name; do
            src_repo="${ref%@*}"          # docker.io/library/traefik:v3
            digest="${ref#*@}"            # sha256:...
            src_norepo="${src_repo%:*}"   # docker.io/library/traefik
            tag="${src_repo##*:}"         # v3
            dest="ghcr.io/${owner}/${name}:${tag}"
            echo "::group::${name}  ${src_norepo}@${digest} -> ${dest}"
            skopeo copy --all --retry-times 3 \
              "docker://${src_norepo}@${digest}" "docker://${dest}"
            # c/image verifies the signature on the per-platform manifest a
            # pull actually resolves to, NOT on the index — so the skip check
            # must look at the amd64 child (noema is x86_64), and signing must
            # be --recursive (index + every child). An index-only signature
            # reads as "no signature exists" at pull time.
            arch_digest=$(skopeo inspect --raw "docker://ghcr.io/${owner}/${name}@${digest}" \
              | jq -r '[.manifests[]? | select(.platform.architecture=="amd64" and .platform.os=="linux")][0].digest // empty')
            if cosign verify --key /tmp/cosign.pub \
                "ghcr.io/${owner}/${name}@${arch_digest:-$digest}" >/dev/null 2>&1; then
              echo "already signed, skipping"
            else
              cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY \
                "ghcr.io/${owner}/${name}@${digest}"
            fi
            echo "::endgroup::"
          done
